<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>The Тюлень</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; font-family: 'Inter', sans-serif; background: #000; transition: background 0.4s; }
    .wrap { width: 100%; min-height: 100vh; position: relative; overflow-x: hidden; }
    .bg { position: fixed; inset: 0; background-image: url('background.png'); background-size: cover; background-position: center 130%; filter: brightness(0.7); transition: filter 0.4s; z-index: -1; }
    #glowCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
    
    /* КНОПКА ТЕМИ */
    .theme-btn { position: fixed; top: 16px; left: 16px; z-index: 10000; width: 52px; height: 52px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); transition: background 0.3s, border-color 0.3s, transform 0.15s; color: rgba(255,255,255,0.8); }
    .theme-btn:hover { transform: scale(1.08); }
    
    /* ДЕННИЙ РЕЖИМ */
    body.day { background: #ece9e3; }
    body.day .bg { filter: brightness(0.3) saturate(0.5); }
    body.day .theme-btn { background: rgba(255,255,255,0.8); border-color: rgba(0,0,0,0.1); color: rgba(0,0,0,0.65); }
    body.day .sidebar, body.day .chat-panel { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.1); }
    body.day .sidebar-header, body.day .mini-player, body.day .chat-header, body.day .chat-bottom { border-color: rgba(0,0,0,0.1); }
    body.day .sidebar-title, body.day .chat-header-title { color: rgba(0,0,0,0.5); }
    body.day .sidebar-count, body.day .chat-header-sub, body.day .sidebar-drag-hint { color: rgba(0,0,0,0.3); }
    body.day .mini-title { color: #111; }
    body.day .mini-artist { color: rgba(0,0,0,0.5); }
    body.day .mini-time { color: rgba(0,0,0,0.4); }
    body.day .mini-prog-bg { background: rgba(0,0,0,0.1); }
    body.day .mini-prog-fill { background: #222; }
    body.day .mc-btn { color: rgba(0,0,0,0.5); }
    body.day .mc-btn:hover { color: #000; }
    body.day .mc-btn.play { background: rgba(0,0,0,0.07); border-color: rgba(0,0,0,0.1); }
    body.day .mc-btn.play:hover { background: rgba(0,0,0,0.13); }
    body.day .track-item:hover { background: rgba(0,0,0,0.04); }
    body.day .track-item.active { background: rgba(0,0,0,0.07); }
    body.day .track-item-title { color: rgba(0,0,0,0.7); }
    body.day .track-item.active .track-item-title { color: #000; }
    body.day .track-item-artist { color: rgba(0,0,0,0.4); }
    body.day .track-num { color: rgba(0,0,0,0.2); }
    body.day .chat-msg-text { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.06); color: #222; }
    body.day .chat-msg-name { color: rgba(0,0,0,0.5); }
    body.day .chat-msg-time { color: rgba(0,0,0,0.3); }
    body.day .chat-input { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); color: #111; }
    body.day .chat-send { background: rgba(0,0,0,0.07); border-color: rgba(0,0,0,0.09); color: rgba(0,0,0,0.5); }
    body.day .chat-send:hover { background: rgba(0,0,0,0.13); color: #000; }
    body.day .about-card { background: rgba(255,255,255,0.92); border-color: rgba(0,0,0,0.1); }
    body.day .about-label { color: rgba(0,0,0,0.4); }
    body.day .about-bio { color: rgba(0,0,0,0.8); }
    body.day .stats-row { color: rgba(0,0,0,0.5); }
    body.day .profile-card { background: rgba(255,255,255,0.92); border-color: rgba(0,0,0,0.1); }
    body.day .profile-name { color: #111; text-shadow: none; }
    body.day .profile-quote { color: rgba(0,0,0,0.6); border-color: rgba(0,0,0,0.2); }
    
    /* ОСНОВНИЙ КОНТЕНТ — ВЕРТИКАЛЬНО */
    .content { position: relative; z-index: 2; max-width: 600px; margin: 0 auto; padding: 80px 20px 100px 20px; }
    
    /* ПРОФІЛЬНА КАРТКА */
    .profile-card { width: 100%; background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; overflow: hidden; backdrop-filter: blur(12px); transition: background 0.4s, border-color 0.4s; margin-bottom: 20px; }
    .profile-card-bg { position: absolute; inset: 0; background-image: url('background.png'); background-size: cover; background-position: center; opacity: 0.1; }
    .profile-card-inner { position: relative; display: flex; align-items: center; gap: 20px; padding: 24px; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); overflow: hidden; flex-shrink: 0; background: rgba(0,0,0,0.3); }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-name { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 0.02em; line-height: 1.2; margin-bottom: 8px; }
    .profile-quote { font-size: 13px; font-style: italic; color: rgba(255,255,255,0.7); padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.4); }
    
    /* КАРТКА ПРО МЕНЕ */
    .about-card { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; backdrop-filter: blur(12px); transition: background 0.4s, border-color 0.4s; margin-bottom: 20px; }
    .about-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .about-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: rgba(255,255,255,0.4); text-transform: uppercase; }
    .lang-flags { display: flex; gap: 8px; }
    .lang-flag { width: 28px; height: 20px; border-radius: 4px; cursor: pointer; overflow: hidden; opacity: 0.5; transition: opacity 0.15s, transform 0.15s; border: 1px solid transparent; }
    .lang-flag img { width: 100%; height: 100%; object-fit: cover; }
    .lang-flag:hover { opacity: 0.8; transform: scale(1.05); }
    .lang-flag.active { opacity: 1; transform: scale(1.1); border-color: rgba(255,255,255,0.5); }
    .about-bio { font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.8; margin-bottom: 12px; }
    .about-bio p { margin-bottom: 8px; }
    .stats-row { font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
    
    /* ПЛЕЙЛИСТ (САЙДБАР) */
    .sidebar { width: 100%; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; backdrop-filter: blur(16px); display: flex; flex-direction: column; overflow: hidden; margin-bottom: 20px; transition: background 0.4s, border-color 0.4s; }
    .sidebar-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-title { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: rgba(255,255,255,0.4); text-transform: uppercase; }
    .sidebar-count { font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 2px; }
    .sidebar-drag-hint { font-size: 10px; color: rgba(255,255,255,0.2); }
    
    /* МІНІ ПЛЕЄР */
    .mini-player { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .mini-now { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .mini-cover { width: 54px; height: 54px; border-radius: 10px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .mini-cover img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .mini-track { flex: 1; }
    .mini-title { font-size: 14px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 12px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .mini-progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .mini-time { font-size: 11px; color: rgba(255,255,255,0.4); min-width: 35px; }
    .mini-time.r { text-align: right; }
    .mini-prog-bg { flex: 1; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; cursor: pointer; }
    .mini-prog-fill { height: 3px; background: #fff; border-radius: 2px; width: 0%; }
    .mini-controls { display: flex; align-items: center; justify-content: center; gap: 25px; }
    .mc-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.6); padding: 0; transition: color 0.15s; display: flex; align-items: center; justify-content: center; }
    .mc-btn:hover { color: #fff; }
    .mc-btn.play { width: 42px; height: 42px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); }
    .mc-btn.play:hover { background: rgba(255,255,255,0.2); }
    .mini-vol { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .mini-vol-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.6); padding: 0; display: flex; align-items: center; }
    .mini-vol-slider { width: 60px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; cursor: pointer; }
    .mini-vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; }
    
    /* СПИСОК ТРЕКІВ */
    .sidebar-list { max-height: 300px; overflow-y: auto; }
    .sidebar-list::-webkit-scrollbar { width: 3px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .track-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.15s; }
    .track-item:hover { background: rgba(255,255,255,0.05); }
    .track-item.active { background: rgba(255,255,255,0.08); }
    .track-item.active .track-item-title { color: #fff; }
    .track-num { font-size: 11px; color: rgba(255,255,255,0.3); min-width: 24px; }
    .track-item.active .track-num { display: none; }
    .track-playing { display: none; min-width: 24px; }
    .track-item.active .track-playing { display: flex; }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .bar { width: 2px; background: #fff; border-radius: 1px; animation: barBounce 0.8s ease-in-out infinite; }
    .bar:nth-child(1) { height: 4px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .bar:nth-child(3) { height: 6px; animation-delay: 0.3s; }
    @keyframes barBounce { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    .bars.paused .bar { animation-play-state: paused; }
    .track-cover { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; flex-shrink: 0; }
    .track-cover img { width: 100%; height: 100%; object-fit: cover; }
    .track-meta { flex: 1; }
    .track-item-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-item-artist { font-size: 10px; color: rgba(255,255,255,0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    
    /* ЧАТ */
    .chat-panel { width: 100%; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; backdrop-filter: blur(16px); display: flex; flex-direction: column; overflow: hidden; transition: background 0.4s, border-color 0.4s; }
    .chat-header { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .chat-header-title { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: rgba(255,255,255,0.4); text-transform: uppercase; }
    .chat-header-sub { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 4px; }
    .chat-messages { flex: 1; max-height: 350px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .chat-msg { display: flex; flex-direction: column; gap: 4px; }
    .chat-msg-top { display: flex; align-items: center; justify-content: space-between; }
    .chat-msg-name { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.45); }
    .chat-msg-time { font-size: 9px; color: rgba(255,255,255,0.25); }
    .chat-msg-text { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.45; word-break: break-word; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 8px 12px; }
    .chat-empty { text-align: center; padding: 30px; color: rgba(255,255,255,0.25); font-size: 12px; }
    .chat-bottom { padding: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
    .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
    .chat-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 14px; font-family: 'Inter', sans-serif; font-size: 13px; color: #fff; outline: none; resize: none; min-height: 40px; max-height: 80px; line-height: 1.4; }
    .chat-input::placeholder { color: rgba(255,255,255,0.3); }
    .chat-input:focus { border-color: rgba(255,255,255,0.25); }
    .chat-send { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0; color: rgba(255,255,255,0.7); }
    .chat-send:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .chat-notice { font-size: 10px; color: rgba(255,255,255,0.25); text-align: center; margin-top: 10px; }
    .chat-already { font-size: 12px; color: rgba(255,255,255,0.4); text-align: center; padding: 15px; }
    .chat-loading { display: flex; align-items: center; justify-content: center; padding: 20px; gap: 8px; color: rgba(255,255,255,0.3); }
    .chat-spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.1); border-top-color: rgba(255,255,255,0.5); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ДЛЯ ВЕЛИКИХ ЕКРАНІВ — ЦЕНТРУЄМО */
    @media (min-width: 768px) {
      .content { max-width: 550px; margin: 0 auto; }
    }
  </style>
</head>
<body>
<canvas id="glowCanvas"></canvas>
<button class="theme-btn" id="themeBtn" title="Toggle day/night">
  <svg id="themeIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
</button>
<div class="wrap">
  <div class="bg"></div>
  <div class="content">
    
    <!-- ПРОФІЛЬ -->
    <div class="profile-card">
      <div class="profile-card-bg"></div>
      <div class="profile-card-inner">
        <div class="profile-avatar"><img src="myavatarka.jpg" alt="avatar"/></div>
        <div class="profile-info">
          <div class="profile-name">The Тюлень</div>
          <div class="profile-quote" data-i18n="quote">i like music more than people</div>
        </div>
      </div>
    </div>

    <!-- ПРО МЕНЕ -->
    <div class="about-card">
      <div class="about-top">
        <div class="about-label" data-i18n="about_me">About me</div>
        <div class="lang-flags">
          <span class="lang-flag active" data-lang="en" title="English"><img src="flags/gb.png" alt="EN"/></span>
          <span class="lang-flag" data-lang="uk" title="Українська"><img src="flags/ua.png" alt="UA"/></span>
          <span class="lang-flag" data-lang="ru" title="Русский"><img src="flags/ru.png" alt="RU"/></span>
          <span class="lang-flag" data-lang="es" title="Español"><img src="flags/es.png" alt="ES"/></span>
        </div>
      </div>
      <div class="about-bio" id="aboutBio"></div>
      <div class="stats-row" data-i18n="location">📍 Ukraine / Poland</div>
    </div>

    <!-- ПЛЕЙЛИСТ -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="sidebar-title" data-i18n="playlist">Playlist</div>
          <div class="sidebar-count" id="sidebarCount"></div>
        </div>
      </div>
      <div class="mini-player">
        <div class="mini-now">
          <div class="mini-cover">
            <img id="miniCoverImg" src="" alt=""/>
            <svg id="miniNoteIcon" width="20" height="20" viewBox="0 0 24 24" fill="rgba(255,255,255,0.4)"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </div>
          <div class="mini-track">
            <div class="mini-title" id="miniTitle">— will be soon —</div>
            <div class="mini-artist" id="miniArtist"></div>
          </div>
        </div>
        <div class="mini-progress-row">
          <span class="mini-time" id="miniTimeNow">0:00</span>
          <div class="mini-prog-bg" id="miniProgBg"><div class="mini-prog-fill" id="miniProgFill"></div></div>
          <span class="mini-time r" id="miniTimeDur">0:00</span>
        </div>
        <div class="mini-controls">
          <button class="mc-btn" id="btnPrev"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button class="mc-btn play" id="btnPlay">
            <svg id="iconPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="mc-btn" id="btnNext"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.5 3.64L8 15.64V9.86zM16 6h2v12h-2z"/></svg></button>
          <div class="mini-vol">
            <button class="mini-vol-btn" id="volBtn">
              <svg id="volIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              <svg id="muteIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 19l2 2L21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <input class="mini-vol-slider" type="range" id="volSlider" min="0" max="100" value="80"/>
          </div>
        </div>
      </div>
      <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <!-- ЧАТ -->
    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-title" data-i18n="comments">Comments</div>

<script>

  const translations = {

      loading:'Завантаження...', leave_comment:'Залишити коментар...', chat_notice:'Макс. 280 символів · лише один раз',
      about_me:'Про мене', location:'📍 Україна / Польща', quote:'я люблю музику більше ніж людей',

    },
    ru: {
      playlist:'Плейлист', comments:'Комментарии', comments_sub:'1 сообщение · анонимно',
      loading:'Загрузка...', leave_comment:'Оставить комментарий...', chat_notice:'Макс. 280 символов · один раз',
      about_me:'Обо мне', location:'📍 Украина / Польша', quote:'я люблю музыку больше чем людей',
      already_posted:'✓ Вы уже оставили комментарий',
      bio:`<p>🎬 YouTube & TikTok автор — 45М+ просмотров</p><p>🖥️ Владелец Minecraft серверов</p><p>🌍 Посетил 19 стран</p><p>📦 Продал 3 000+ товаров онлайн</p><p>💻 Недо разработчик</p><p>🗣️ Языки: ${flagsHtml}</p>`
    },
    es: {
      playlist:'Lista', comments:'Comentarios', comments_sub:'1 mensaje · anónimo',
      loading:'Cargando...', leave_comment:'Deja un comentario...', chat_notice:'Máx. 280 caracteres · solo una vez',
      about_me:'Sobre mí', location:'📍 Ucrania / Polonia', quote:'me gusta la música más que la gente',
      already_posted:'✓ Ya dejaste un comentario',
      bio:`<p>🎬 Creador en YouTube & TikTok — 45M+ vistas</p><p>🖥️ Dueño de servidores de Minecraft</p><p>🌍 Visitó 19 países</p><p>📦 Vendió 3,000+ productos online</p><p>💻 Un poco desarrollador</p><p>🗣️ Idiomas: ${flagsHtml}</p>`
    }
  };

  let currentLang = 'en', hasPosted = false;

  function applyLang(lang) {
    currentLang = lang;
    const t = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.dataset.i18n;
      if (t[k] !== undefined) el.innerHTML = t[k];
    });
    const chatInput = document.getElementById('chatInput');
    if (chatInput) chatInput.placeholder = t.leave_comment;
    const aboutBio = document.getElementById('aboutBio');
    if (aboutBio) aboutBio.innerHTML = t.bio;
    document.querySelectorAll('.lang-flag').forEach(b => b.classList.remove('active'));
    const activeFlag = document.querySelector(`.lang-flag[data-lang="${lang}"]`);
    if (activeFlag) activeFlag.classList.add('active');
    if (hasPosted) {
      const el = document.querySelector('.chat-already');
      if (el) el.textContent = t.already_posted;
    }
  }

  document.querySelectorAll('.lang-flag').forEach(btn => { btn.onclick = () => applyLang(btn.dataset.lang); });
  applyLang('en');

  const SUN = `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>`;
  const MOON = `<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>`;
  let isDay = false;
  const themeBtn = document.getElementById('themeBtn');
  if (themeBtn) {
    themeBtn.onclick = () => {
      isDay = !isDay;
      document.body.classList.toggle('day', isDay);
      document.getElementById('themeIcon').innerHTML = isDay ? MOON : SUN;
    };
  }

  const SUPABASE_URL = 'https://cukvmexucbutucmzgapz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SNTiux5vDCfKdRtVlGJLOw__6zGNcQ3';
  async function sbFetch(path, opts={}) {
    const res = await fetch(SUPABASE_URL+path, {...opts, headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});
    return res.json();
  }
  async function getIpHash() {
    try { const r=await fetch('https://api.ipify.org?format=json'); const d=await r.json(); let h=0; for(let i=0;i<d.ip.length;i++){h=((h<<5)-h)+d.ip.charCodeAt(i);h|=0;} return 'ip_'+Math.abs(h).toString(36); }
    catch { return 'ip_'+Math.random().toString(36).slice(2,10); }
  }
  let myIpHash = null;
  function timeAgo(s){const d=(Date.now()-new Date(s))/1000;if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';}
  function anonName(h){const n=['Seal','Ghost','Shadow','Void','Echo','Mist','Storm','Frost','Raven','Dusk','Neon','Pixel'];let s=0;for(let c of h)s+=c.charCodeAt(0);return'Anon '+n[s%n.length]+' #'+(s%99+1);}
  function renderMessages(msgs){
    const box=document.getElementById('chatMessages');
    if(!box) return;
    if(!msgs||msgs.length===0){box.innerHTML=`<div class="chat-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span>No comments yet.<br>Be the first!</span></div>`;return;}
    box.innerHTML=msgs.map(m=>`<div class="chat-msg"><div class="chat-msg-top"><span class="chat-msg-name">${anonName(m.ip_hash)}</span><span class="chat-msg-time">${timeAgo(m.created_at)}</span></div><div class="chat-msg-text">${m.message.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>`).join('');
    box.scrollTop=box.scrollHeight;
  }
  function showAlreadyPosted(){
    hasPosted=true;
    const bottom = document.getElementById('chatBottom');
    if(bottom) bottom.innerHTML=`<div class="chat-already">${translations[currentLang].already_posted}</div>`;
  }
  async function loadComments(){
    const data=await sbFetch('/rest/v1/comments?select=*&order=created_at.asc');
    renderMessages(Array.isArray(data)?data:[]);
    if(myIpHash&&Array.isArray(data)&&data.find(m=>m.ip_hash===myIpHash)) showAlreadyPosted();
  }
  async function initChat(){myIpHash=await getIpHash();await loadComments();setInterval(loadComments,15000);}
  const sendBtn = document.getElementById('chatSend');
  const chatInput = document.getElementById('chatInput');
  if(sendBtn && chatInput) {
    sendBtn.onclick=async()=>{
      if(hasPosted)return;
      const text=chatInput.value.trim(); if(!text)return;
      sendBtn.disabled=true; chatInput.disabled=true;
      const result=await sbFetch('/rest/v1/comments',{method:'POST',body:JSON.stringify({ip_hash:myIpHash,message:text})});
      if(Array.isArray(result)&&result.length>0){showAlreadyPosted();await loadComments();}
      else{sendBtn.disabled=false;chatInput.disabled=false;if(result?.code==='23505')showAlreadyPosted();}
    };
    chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendBtn.click();}});
    chatInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});
  }
  initChat();

  const canvas=document.getElementById('glowCanvas'); 
  if(canvas) {
    const ctx=canvas.getContext('2d');
    function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;} 
    resizeCanvas(); 
    window.addEventListener('resize',resizeCanvas);
    const trail=[];
    window.addEventListener('mousemove',e=>{trail.push({x:e.clientX,y:e.clientY,alpha:1});if(trail.length>80)trail.shift();});
    function drawTrail(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(let i=1;i<trail.length;i++){const p0=trail[i-1],p1=trail[i];p0.alpha-=0.018;if(p0.alpha<0)p0.alpha=0;const t=i/trail.length;const a=Math.min(p0.alpha,p1.alpha)*0.75;if(a<=0)continue;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=0.8+t*1.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
      while(trail.length>0&&trail[0].alpha<=0)trail.shift();
      requestAnimationFrame(drawTrail);
    }
    drawTrail();
  }

  const playlist=[
    {title:"Saccharine",artist:"Violent Vira",src:"saccharine.mp3",cover:"saccharine.png"},
    {title:"Hide Your Kids",artist:"ThxSoMch",src:"hideyourkids.mp3",cover:"hideyourkids.png"},
    {title:"Небо",artist:"SadSvit",src:"nebo.mp3",cover:"nebo.jpg"},
    {title:"Parasite",artist:"cloudyfield",src:"parasite.mp3",cover:"parasite.png"},
    {title:"GUN TO MY FACE",artist:"h3nce",src:"guntomyface.mp3",cover:"guntomyface.png"},
    {title:"Молодой авангардист",artist:"Конец солнечных дней",src:"molodoyavangadist.mp3",cover:"molodoyavangadist.png"},
    {title:"Почему ты ещё не фанат?",artist:"СЕРЕГА ПИРАТ",src:"pocheshenefan.mp3",cover:"pocheshenefan.png"},
    {title:"Revenge",artist:"XXXTENTACION",src:"revenge.mp3",cover:"re venge.png"},
  ];
  let current=0,isPlaying=false;
  const audio=document.getElementById('audio');
  function fmt(s){if(isNaN(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
  function buildSidebar(){
    const list=document.getElementById('sidebarList');
    if(!list) return;
    document.getElementById('sidebarCount').textContent=playlist.length+' tracks';
    list.innerHTML='';
    playlist.forEach((t,i)=>{
      const item=document.createElement('div'); item.className='track-item'+(i===current?' active':'');
      item.innerHTML=`<span class="track-num">${i+1}</span><div class="track-playing"><div class="bars${isPlaying&&i===current?'':' paused'}"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div><div class="track-cover">${t.cover?`<img src="${t.cover}" style="display:block"/>`:`<svg width="13" height="13" viewBox="0 0 24 24" fill="rgba(255,255,255,0.4)"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>`}</div><div class="track-meta"><div class="track-item-title">${t.title}</div><div class="track-item-artist">${t.artist||''}</div></div>`;
      item.onclick=()=>{current=i;load(current);play();}; list.appendChild(item);
    });
  }
  function updateSidebar(){document.querySelectorAll('.track-item').forEach((el,i)=>{el.classList.toggle('active',i===current);const bars=el.querySelector('.bars');if(bars)bars.classList.toggle('paused',!isPlaying||i!==current);});}
  function load(idx){
    const t=playlist[idx]; 
    document.getElementById('miniTitle').textContent=t.title; 
    document.getElementById('miniArtist').textContent=t.artist||''; 
    audio.src=t.src||'';
    document.getElementById('miniProgFill').style.width='0%'; 
    document.getElementById('miniTimeNow').textContent='0:00'; 
    document.getElementById('miniTimeDur').textContent='0:00';
    const img=document.getElementById('miniCoverImg'),note=document.getElementById('miniNoteIcon');
    if(t.cover && img && note){img.src=t.cover;img.style.display='block';note.style.display='none';}
    else if(img && note){img.style.display='none';note.style.display='block';}
    updateSidebar();
  }
  function play(){if(!audio.src||audio.src===window.location.href)return;audio.play();isPlaying=true;document.getElementById('iconPlay').style.display='none';document.getElementById('iconPause').style.display='block';updateSidebar();}
  function pause(){audio.pause();isPlaying=false;document.getElementById('iconPlay').style.display='block';document.getElementById('iconPause').style.display='none';updateSidebar();}
  const playBtn=document.getElementById('btnPlay');
  if(playBtn) playBtn.onclick=()=>isPlaying?pause():play();
  const nextBtn=document.getElementById('btnNext');
  if(nextBtn) nextBtn.onclick=()=>{current=(current+1)%playlist.length;load(current);if(isPlaying)play();};
  const prevBtn=document.getElementById('btnPrev');
  if(prevBtn) prevBtn.onclick=()=>{if(audio.currentTime>3){audio.currentTime=0;return;}current=(current-1+playlist.length)%playlist.length;load(current);if(isPlaying)play();};
  audio.ontimeupdate=()=>{if(!audio.duration)return;document.getElementById('miniProgFill').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('miniTimeNow').textContent=fmt(audio.currentTime);document.getElementById('miniTimeDur').textContent=fmt(audio.duration);};
  audio.onended=()=>{current=(current+1)%playlist.length;load(current);play();};
  const progBg=document.getElementById('miniProgBg');
  if(progBg) progBg.onclick=(e)=>{if(!audio.duration)return;const rect=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;};
  audio.volume=0.8;
  const volSlider=document.getElementById('volSlider');
  if(volSlider) volSlider.oninput=()=>{audio.volume=volSlider.value/100;document.getElementById('volIcon').style.display=audio.volume===0?'none':'block';document.getElementById('muteIcon').style.display=audio.volume===0?'block':'none';};
  const volBtn=document.getElementById('volBtn');
  if(volBtn) volBtn.onclick=()=>{if(audio.volume>0){audio.volume=0;volSlider.value=0;document.getElementById('volIcon').style.display='none';document.getElementById('muteIcon').style.display='block';}else{audio.volume=0.8;volSlider.value=80;document.getElementById('volIcon').style.display='block';document.getElementById('muteIcon').style.display='none';}};
  buildSidebar(); load(0);
</script>
